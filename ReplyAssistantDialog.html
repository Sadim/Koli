<style>
  :root { --green: oklch(45% .1 190); --green-dark: oklch(41% .11 190); --border: oklch(13% 0 0 / .08); --text: oklch(22% 0 0); --text-muted: oklch(46% 0 0); --amber-bg: oklch(77% .13 82 / .14); --amber-ink: oklch(46% 0 0); --err: oklch(52% .16 35); }
  * { box-sizing: border-box; }
  body { font-family: 'Albert Sans', 'Avenir Next', 'Helvetica Neue', Arial, system-ui, sans-serif; color: var(--text); padding: 22px; font-size: 13px; }
  h2 { font-size: 18px; margin: 0 0 4px 0; }
  .subtitle { color: var(--text-muted); font-size: 11.5px; margin-bottom: 16px; line-height: 1.4; }
  label { font-weight: 600; display: block; margin: 12px 0 6px 0; font-size: 12.5px; }
  textarea, input[type="text"] {
    width: 100%; padding: 9px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px;
    font-family: inherit; resize: vertical;
  }
  textarea { min-height: 90px; }
  textarea:focus, input[type="text"]:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px oklch(77% .13 82 / .14); }
  .hint { color: var(--text-muted); font-size: 11px; margin-top: 6px; line-height: 1.4; }
  .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
  .actions.split { justify-content: space-between; }
  button { padding: 9px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 12.5px; border: none; }
  .btn-secondary { background: oklch(99.5% 0 0); border: 1px solid var(--border) !important; color: var(--text); }
  .btn-primary { background: var(--green); color: #fff; }
  .btn-primary:hover { background: var(--green-dark); }
  .btn-primary:disabled, button:disabled { opacity: 0.5; cursor: not-allowed; }
  .status { font-size: 12px; margin-top: 10px; display: none; }
  .status.err { color: var(--err); }

  .category-pill {
    display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: 0.3px;
    padding: 3px 9px; border-radius: 20px; background: var(--amber-bg); color: var(--amber-ink); margin-bottom: 10px;
  }
  .draft-box { border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; background: oklch(95% 0 0); }
  .draft-subject { font-weight: 700; margin-bottom: 8px; background: oklch(99.5% 0 0); }
  .edit-toolbar { display: flex; gap: 2px; margin-bottom: 6px; }
  .edit-toolbar button {
    width: 28px; height: 26px; padding: 0; border: 1px solid var(--border); background: oklch(99.5% 0 0); color: var(--text);
    border-radius: 5px; font-size: 12.5px; line-height: 1;
  }
  .edit-toolbar button.i { font-style: italic; }
  .edit-toolbar button.u { text-decoration: underline; }
  .edit-toolbar button.active { background: oklch(77% .13 82 / .14); border-color: var(--green); color: var(--green-dark); }
  .draft-body {
    font-family: inherit; font-size: 12.5px; line-height: 1.5; background: oklch(99.5% 0 0); min-height: 130px;
    border: 1px solid var(--border); border-radius: 8px; padding: 9px 10px; white-space: pre-wrap;
  }
  .draft-body:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px oklch(77% .13 82 / .14); }
  .draft-meta { font-size: 10.5px; color: var(--text-muted); margin-top: 8px; }
  .draft-meta.over { color: var(--err); font-weight: 600; }
  #resultView { display: none; }
</style>

<div id="formView">
  <h2>Draft a Reply</h2>
  <div class="subtitle">Paste what they wrote back. Koli reads it, figures out what kind of reply it is (asking about rate, not interested, wants more info, ready to move forward), and drafts a response that actually fits.</div>

  <label for="incomingReply">Their reply</label>
  <textarea id="incomingReply" placeholder="Paste the email or message they sent back..."></textarea>

  <label for="customInstructions">Custom instructions (optional)</label>
  <textarea id="customInstructions" placeholder="e.g. keep it to one sentence, mention we can start next month" style="min-height: 60px;"></textarea>

  <div class="status" id="formStatus"></div>

  <div class="actions">
    <button class="btn-secondary" onclick="google.script.host.close()">Cancel</button>
    <button class="btn-primary" id="generateBtn">Draft Reply</button>
  </div>
</div>

<div id="resultView">
  <h2>Draft a Reply</h2>
  <div class="category-pill" id="categoryPill">Reply</div>
  <div class="draft-box">
    <label for="draftSubject" style="margin-top:0;">Subject</label>
    <input type="text" class="draft-subject" id="draftSubject" />
    <label for="draftBody">Body</label>
    <div class="edit-toolbar">
      <button type="button" id="fmtBold"><b>B</b></button>
      <button type="button" id="fmtItalic" class="i">I</button>
      <button type="button" id="fmtUnderline" class="u">U</button>
    </div>
    <div class="draft-body" id="draftBody" contenteditable="true"></div>
  </div>
  <div class="draft-meta" id="draftMeta"></div>

  <div class="status" id="resultStatus"></div>

  <div class="actions split">
    <button class="btn-secondary" id="closeBtn">Close (saves as-is)</button>
    <div style="display:flex;gap:10px;">
      <button class="btn-secondary" id="regenBtn">Regenerate</button>
      <button class="btn-primary" id="saveBtn">Save to Outreach Drafts</button>
    </div>
  </div>
</div>

<script>
  const REPLY_MAX_CHARS_CLIENT = 500;
  const CATEGORY_LABELS = {
    rate_question: 'Rate question', objection: 'Objection / not interested',
    info_request: 'Wants more info', interested: 'Ready to move forward', other: 'Reply'
  };
  let current = null; // last preview response

  function updateMeta() {
    const len = document.getElementById('draftBody').innerText.length;
    const meta = document.getElementById('draftMeta');
    meta.textContent = len + '/' + REPLY_MAX_CHARS_CLIENT + ' characters';
    meta.className = 'draft-meta' + (len > REPLY_MAX_CHARS_CLIENT ? ' over' : '');
  }

  // Same run-extraction approach as DraftOutreachEmailDialog: walks the
  // contenteditable body into {text, bold, italic, underline} runs so
  // Bold/Italic/Underline survive into the actual Sheet cell.
  function extractRuns(container) {
    const runs = [];
    let sawBlock = false;
    function pushText(text, bold, italic, underline) {
      if (text) runs.push({ text: text, bold: !!bold, italic: !!italic, underline: !!underline });
    }
    function walk(node, bold, italic, underline) {
      if (node.nodeType === Node.TEXT_NODE) { pushText(node.textContent, bold, italic, underline); return; }
      if (node.nodeType !== Node.ELEMENT_NODE) return;
      const tag = node.tagName.toLowerCase();
      if (tag === 'br') { pushText('\n', bold, italic, underline); return; }
      const isBlock = tag === 'div' || tag === 'p';
      if (isBlock && sawBlock) pushText('\n', bold, italic, underline);
      if (isBlock) sawBlock = true;
      const nb = bold || tag === 'b' || tag === 'strong';
      const ni = italic || tag === 'i' || tag === 'em';
      const nu = underline || tag === 'u';
      Array.prototype.forEach.call(node.childNodes, (child) => walk(child, nb, ni, nu));
    }
    Array.prototype.forEach.call(container.childNodes, (child) => walk(child, false, false, false));
    return runs;
  }

  function wireFormatButton(id, command) {
    const btn = document.getElementById(id);
    btn.addEventListener('mousedown', (e) => { e.preventDefault(); document.execCommand(command); refreshToolbarState(); });
  }
  function refreshToolbarState() {
    document.getElementById('fmtBold').classList.toggle('active', document.queryCommandState('bold'));
    document.getElementById('fmtItalic').classList.toggle('active', document.queryCommandState('italic'));
    document.getElementById('fmtUnderline').classList.toggle('active', document.queryCommandState('underline'));
  }
  wireFormatButton('fmtBold', 'bold');
  wireFormatButton('fmtItalic', 'italic');
  wireFormatButton('fmtUnderline', 'underline');
  document.getElementById('draftBody').addEventListener('keyup', refreshToolbarState);
  document.getElementById('draftBody').addEventListener('mouseup', refreshToolbarState);
  document.getElementById('draftBody').addEventListener('input', updateMeta);

  function renderDraft(resp) {
    current = resp;
    document.getElementById('formView').style.display = 'none';
    document.getElementById('resultView').style.display = 'block';
    document.getElementById('categoryPill').textContent = CATEGORY_LABELS[resp.category] || 'Reply';
    document.getElementById('draftSubject').value = resp.subject;
    document.getElementById('draftBody').innerText = resp.body;
    updateMeta();
    document.getElementById('resultStatus').style.display = 'none';
    setButtonsBusy(false);
    document.getElementById('regenBtn').textContent = 'Regenerate';
    document.getElementById('saveBtn').textContent = 'Save to Outreach Drafts';
    document.getElementById('closeBtn').textContent = 'Close (saves as-is)';
  }

  function setButtonsBusy(busy) {
    document.getElementById('regenBtn').disabled = busy;
    document.getElementById('saveBtn').disabled = busy;
    document.getElementById('closeBtn').disabled = busy;
  }

  function runPreview() {
    const incomingReply = document.getElementById('incomingReply').value.trim();
    const customInstructions = document.getElementById('customInstructions').value.trim();
    google.script.run
      .withSuccessHandler(renderDraft)
      .withFailureHandler((err) => {
        const formStatus = document.getElementById('formStatus');
        const resultStatus = document.getElementById('resultStatus');
        const msg = err.message || String(err);
        if (document.getElementById('resultView').style.display === 'block') {
          resultStatus.className = 'status err'; resultStatus.textContent = msg; resultStatus.style.display = 'block';
          setButtonsBusy(false);
        } else {
          formStatus.className = 'status err'; formStatus.textContent = msg; formStatus.style.display = 'block';
          document.getElementById('generateBtn').disabled = false;
          document.getElementById('generateBtn').textContent = 'Draft Reply';
        }
      })
      .previewReplyDraft(<?= row ?>, incomingReply, customInstructions);
  }

  document.getElementById('generateBtn').onclick = () => {
    const btn = document.getElementById('generateBtn');
    if (!document.getElementById('incomingReply').value.trim()) {
      const status = document.getElementById('formStatus');
      status.className = 'status err'; status.textContent = 'Paste what they wrote back first.'; status.style.display = 'block';
      return;
    }
    document.getElementById('formStatus').style.display = 'none';
    btn.disabled = true; btn.textContent = 'Drafting…';
    runPreview();
  };

  document.getElementById('regenBtn').onclick = () => {
    setButtonsBusy(true);
    document.getElementById('regenBtn').textContent = 'Drafting…';
    runPreview();
  };

  function saveAndClose(btn, busyLabel) {
    if (!current) return;
    setButtonsBusy(true);
    btn.textContent = busyLabel;
    const bodyEl = document.getElementById('draftBody');
    const runs = extractRuns(bodyEl);
    const plainBody = bodyEl.innerText.trim();
    const incomingReply = document.getElementById('incomingReply').value.trim();
    google.script.run
      .withSuccessHandler(() => google.script.host.close())
      .withFailureHandler((err) => {
        const resultStatus = document.getElementById('resultStatus');
        resultStatus.className = 'status err'; resultStatus.textContent = err.message || String(err); resultStatus.style.display = 'block';
        setButtonsBusy(false);
        document.getElementById('saveBtn').textContent = 'Save to Outreach Drafts';
        document.getElementById('closeBtn').textContent = 'Close (saves as-is)';
      })
      .commitReplyDraft(current.row, incomingReply, plainBody, runs);
  }

  document.getElementById('saveBtn').onclick = () => saveAndClose(document.getElementById('saveBtn'), 'Saving…');
  document.getElementById('closeBtn').onclick = () => saveAndClose(document.getElementById('closeBtn'), 'Saving…');
</script>
