<style>
  :root { --green: #188038; --green-dark: #0d652d; --border: #dadce0; --text: #202124; --text-muted: #5f6368; }
  * { box-sizing: border-box; }
  body { font-family: 'Google Sans', Roboto, Arial, sans-serif; color: var(--text); padding: 22px; font-size: 13px; }
  h2 { font-size: 18px; margin: 0 0 4px 0; }
  .subtitle { color: var(--text-muted); font-size: 11.5px; margin-bottom: 16px; }
  label { font-weight: 600; display: block; margin: 12px 0 6px 0; font-size: 12.5px; }
  input[type="text"], input[type="number"], input[type="date"], textarea {
    width: 100%; padding: 9px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; font-family: inherit;
  }
  textarea { min-height: 56px; resize: vertical; }
  input:focus, textarea:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px #e6f4ea; }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }
  .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
  button { padding: 9px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 13px; border: none; }
  .btn-secondary { background: #fff; border: 1px solid var(--border) !important; color: var(--text); }
  .btn-primary { background: var(--green); color: #fff; }
  .btn-primary:hover { background: var(--green-dark); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .status { font-size: 12px; margin-top: 10px; display: none; }
  .status.err { color: #d93025; }
</style>

<h2>New Campaign</h2>
<div class="subtitle">Starts at "Briefed" — move it through stages from the Campaigns tab as the deal progresses.</div>

<label for="brand">Brand / Sponsor *</label>
<input type="text" id="brand" placeholder="e.g. Acme Tools" />

<label for="deliverables">Deliverables</label>
<textarea id="deliverables" placeholder="e.g. 1x dedicated video, 1x Instagram post"></textarea>

<div class="row">
  <div>
    <label for="value">Deal value</label>
    <input type="text" id="value" placeholder="e.g. $2,500" />
  </div>
  <div>
    <label for="deadline">Deadline</label>
    <input type="date" id="deadline" />
  </div>
</div>

<label for="notes">Notes</label>
<textarea id="notes" placeholder="Anything worth remembering about this deal"></textarea>

<div class="status" id="status"></div>

<div class="actions">
  <button class="btn-secondary" onclick="google.script.host.close()">Cancel</button>
  <button class="btn-primary" id="createBtn">Create</button>
</div>

<script>
  document.getElementById('createBtn').onclick = () => {
    const brand = document.getElementById('brand').value.trim();
    const status = document.getElementById('status');
    if (!brand) {
      status.className = 'status err'; status.textContent = 'Brand/sponsor name is required.'; status.style.display = 'block';
      return;
    }
    const btn = document.getElementById('createBtn');
    btn.disabled = true;

    google.script.run
      .withSuccessHandler(() => google.script.host.close())
      .withFailureHandler((err) => {
        status.className = 'status err'; status.textContent = err.message || String(err); status.style.display = 'block';
        btn.disabled = false;
      })
      .createCampaign(
        <?= row ?>,
        brand,
        document.getElementById('deliverables').value.trim(),
        document.getElementById('value').value.trim(),
        document.getElementById('deadline').value,
        document.getElementById('notes').value.trim()
      );
  };
</script>
