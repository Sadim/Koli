<style>
  :root { --green: #188038; --green-dark: #0d652d; --border: #dadce0; --text: #202124; --text-muted: #5f6368; }
  * { box-sizing: border-box; }
  body { font-family: 'Google Sans', Roboto, Arial, sans-serif; color: var(--text); padding: 22px; font-size: 13px; }
  h2 { font-size: 18px; margin: 0 0 4px 0; }
  .subtitle { color: var(--text-muted); font-size: 11.5px; margin-bottom: 16px; }
  label { font-weight: 600; display: block; margin: 12px 0 6px 0; font-size: 12.5px; }
  input[type="text"], select, textarea {
    width: 100%; padding: 9px 10px; border: 1px solid var(--border); border-radius: 10px; font-size: 13px; font-family: inherit;
  }
  textarea { min-height: 50px; resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px #e6f4ea; }
  .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
  button { padding: 9px 18px; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 13px; border: none; }
  .btn-secondary { background: #fff; border: 1px solid var(--border) !important; color: var(--text); }
  .btn-primary { background: var(--green); color: #fff; }
  .btn-primary:hover { background: var(--green-dark); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .status { font-size: 12px; margin-top: 10px; display: none; }
  .status.err { color: #d93025; }
</style>

<h2>Add Brand Target</h2>
<div class="subtitle">Brands you'd actually want on this list get priority in Gap Analysis results.</div>

<label for="brand">Brand name *</label>
<input type="text" id="brand" placeholder="e.g. Acme Tools" />

<label for="niche">Niche / category</label>
<input type="text" id="niche" placeholder="e.g. Outdoor gear" />

<label for="priority">Priority</label>
<select id="priority">
  <option value="High">High</option>
  <option value="Medium" selected>Medium</option>
  <option value="Low">Low</option>
</select>

<label for="notes">Notes</label>
<textarea id="notes" placeholder="Anything worth remembering about this target"></textarea>

<div class="status" id="status"></div>

<div class="actions">
  <button class="btn-secondary" onclick="google.script.host.close()">Cancel</button>
  <button class="btn-primary" id="addBtn">Add</button>
</div>

<script>
  document.getElementById('addBtn').onclick = () => {
    const brand = document.getElementById('brand').value.trim();
    const status = document.getElementById('status');
    if (!brand) {
      status.className = 'status err'; status.textContent = 'Brand name is required.'; status.style.display = 'block';
      return;
    }
    const btn = document.getElementById('addBtn');
    btn.disabled = true;

    google.script.run
      .withSuccessHandler(() => google.script.host.close())
      .withFailureHandler((err) => {
        status.className = 'status err'; status.textContent = err.message || String(err); status.style.display = 'block';
        btn.disabled = false;
      })
      .addBrandTarget(
        brand,
        document.getElementById('niche').value.trim(),
        document.getElementById('priority').value,
        document.getElementById('notes').value.trim()
      );
  };
</script>
